

services:
  postgres:
    image: ankane/pgvector:latest
    container_name: synllion-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: synllion
      POSTGRES_USER: synllion_user
      POSTGRES_PASSWORD: synllion_dev_password_2024
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synllion_user -d synllion"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - synllion-network

  redis:
    image: redis:7-alpine
    container_name: synllion-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - synllion-network

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend/dockerfile
    container_name: synllion-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://synllion_user:synllion_dev_password_2024@postgres:5432/synllion
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=dev-secret-key-change-in-production
      - APP_ENV=development
      - DEBUG=true
    volumes:
      - ./backend:/app
      - /app/.venv
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - synllion-network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
  redis_data:

networks:
  synllion-network:
    driver: bridge
